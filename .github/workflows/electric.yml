name: 发布电费看板

# 抓取已改到国内 IP 的「腾讯云函数 SCF」执行（GitHub Actions 是境外 IP，会被电费平台用 405 拦截）。
# 每个工作流只负责一件事：仓库 main 分支有更新时，把静态站点发布到 GitHub Pages。
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}   # 手动触发，方便测试

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电费监控</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --primary: #0064ff;
      --accent: #00bcff;
      --text: #1f2733;
      --muted: #8a94a6;
      --up: #ff6b5e;
      --border: #eef1f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 20px 14px 60px; }
    header {
      background: linear-gradient(45deg, var(--primary), var(--accent));
      border-radius: 16px;
      padding: 22px 20px;
      color: #fff;
      margin-bottom: 18px;
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    header p { margin: 6px 0 0; font-size: 13px; opacity: .9; }
    .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .card .label { font-size: 12px; color: var(--muted); }
    .card .value { font-size: 26px; font-weight: 700; margin-top: 6px; }
    .card .value small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 3px; }
    .card.hl .value { color: var(--primary); }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .panel h2 { margin: 0 0 6px; font-size: 15px; }
    .panel .sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
    .chart-box { position: relative; width: 100%; height: 300px; }
    .chart-box.tall { height: 250px; }
    .legend-note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
    footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
    @media (min-width: 640px) { .cards { grid-template-columns: repeat(4, 1fr); } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>电费监控</h1>
      <p id="meta">加载中…</p>
    </header>

    <section class="cards" id="cards">
      <div class="card hl"><div class="label">当前剩余金额</div><div class="value" id="c-balance">–</div></div>
      <div class="card"><div class="label">当前剩余电量</div><div class="value" id="c-kwh">–</div></div>
      <div class="card"><div class="label">今日电费</div><div class="value" id="c-today">–</div></div>
      <div class="card"><div class="label">平均每日电费</div><div class="value" id="c-avg">–</div></div>
    </section>

    <section class="panel">
      <h2>剩余金额走势</h2>
      <div class="sub">每天 22:30 抓取一次，余额随用电下降、充值上升</div>
      <div class="chart-box"><canvas id="balanceChart"></canvas></div>
    </section>

    <section class="panel">
      <h2>每日用电费用</h2>
      <div class="sub">每天消耗的电费 = 前一日余额 − 当日余额</div>
      <div class="chart-box tall"><canvas id="costChart"></canvas></div>
      <div class="legend-note">提示：检测到充值的当天无法靠「余额差值」算出真实消耗，该柱会显示为红色并计为 0（充值会使余额上升）。想更精确可把抓取频率改为每小时。</div>
    </section>

    <footer>数据由 GitHub Actions 每日自动抓取 · 页面托管在 GitHub Pages</footer>
  </div>

  <script>
    const fmt = (n) => (n === null || n === undefined || isNaN(n)) ? "–" : Number(n).toFixed(2);
    const BLUE = "#0064ff";
    const BAR = "#00bcff";
    const RED = "#ff6b5e";
    const GRID = "#eef1f6";
    const MUTED = "#8a94a6";

    function hexToRgba(hex, a) {
      const h = hex.replace("#", "");
      const r = parseInt(h.substring(0, 2), 16);
      const g = parseInt(h.substring(2, 4), 16);
      const b = parseInt(h.substring(4, 6), 16);
      return `rgba(${r},${g},${b},${a})`;
    }

    function setupCanvas(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(1, rect.width), h = Math.max(1, rect.height);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, w, h };
    }

    // 通用横轴刻度：最多显示约 8 个标签
    function xStep(n) { return Math.max(1, Math.ceil(n / 8)); }

    function drawLine(canvas, labels, values) {
      const { ctx, w, h } = setupCanvas(canvas);
      ctx.clearRect(0, 0, w, h);
      const padL = 46, padR = 14, padT = 14, padB = 26;
      const plotW = w - padL - padR, plotH = h - padT - padB;
      const n = values.length;
      if (n === 0) return;

      let yMin = Math.min(...values), yMax = Math.max(...values);
      if (yMax - yMin < 1e-9) { yMin -= 1; yMax += 1; }
      const pad = (yMax - yMin) * 0.12;
      yMin -= pad; yMax += pad;
      const toX = i => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
      const toY = v => padT + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

      // 网格 + 纵轴刻度
      ctx.strokeStyle = GRID; ctx.lineWidth = 1;
      ctx.fillStyle = MUTED; ctx.font = "11px sans-serif"; ctx.textAlign = "right";
      const ticks = 4;
      for (let t = 0; t <= ticks; t++) {
        const v = yMin + (yMax - yMin) * (t / ticks);
        const y = toY(v);
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
        ctx.fillText(v.toFixed(2), padL - 6, y + 3);
      }

      // 横轴标签
      ctx.textAlign = "center";
      const step = xStep(n);
      for (let i = 0; i < n; i += step) ctx.fillText(labels[i], toX(i), h - padB + 14);

      // 面积填充
      ctx.beginPath();
      ctx.moveTo(toX(0), toY(values[0]));
      for (let i = 1; i < n; i++) ctx.lineTo(toX(i), toY(values[i]));
      ctx.lineTo(toX(n - 1), padT + plotH); ctx.lineTo(toX(0), padT + plotH); ctx.closePath();
      ctx.fillStyle = hexToRgba(BLUE, 0.10); ctx.fill();

      // 折线
      ctx.beginPath();
      ctx.moveTo(toX(0), toY(values[0]));
      for (let i = 1; i < n; i++) ctx.lineTo(toX(i), toY(values[i]));
      ctx.strokeStyle = BLUE; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();

      // 数据点
      for (let i = 0; i < n; i++) {
        ctx.beginPath(); ctx.arc(toX(i), toY(values[i]), 3, 0, Math.PI * 2);
        ctx.fillStyle = BLUE; ctx.fill();
      }
    }

    function drawBars(canvas, labels, values, colors) {
      const { ctx, w, h } = setupCanvas(canvas);
      ctx.clearRect(0, 0, w, h);
      const padL = 46, padR = 14, padT = 14, padB = 26;
      const plotW = w - padL - padR, plotH = h - padT - padB;
      const n = values.length;
      if (n === 0) return;

      const top = (Math.max(0, ...values) * 1.15) || 1;
      const toY = v => padT + plotH - (v / top) * plotH;
      const toX = i => padL + ((i + 0.5) / n) * plotW;
      const barW = Math.max(2, (plotW / n) * 0.6);
      const baseY = padT + plotH;

      // 网格 + 纵轴
      ctx.strokeStyle = GRID; ctx.lineWidth = 1;
      ctx.fillStyle = MUTED; ctx.font = "11px sans-serif"; ctx.textAlign = "right";
      const ticks = 4;
      for (let t = 0; t <= ticks; t++) {
        const v = top * (t / ticks);
        const y = toY(v);
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
        ctx.fillText(v.toFixed(2), padL - 6, y + 3);
      }

      // 横轴标签
      ctx.textAlign = "center";
      const step = xStep(n);
      for (let i = 0; i < n; i += step) ctx.fillText(labels[i], toX(i), h - padB + 14);

      // 柱子（顶部圆角）
      for (let i = 0; i < n; i++) {
        const v = Math.max(0, values[i]);
        const x = toX(i) - barW / 2;
        const y = toY(v);
        const bh = baseY - y;
        if (bh <= 0.5) continue;
        const r = Math.min(4, barW / 2, bh);
        ctx.fillStyle = colors[i];
        ctx.beginPath();
        ctx.moveTo(x, baseY);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.lineTo(x + barW - r, y);
        ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
        ctx.lineTo(x + barW, baseY);
        ctx.closePath(); ctx.fill();
      }
    }

    let cache = null;

    function render(d) {
      const recs = Array.isArray(d.records) ? d.records : [];
      const last = recs[recs.length - 1];
      document.getElementById("meta").textContent =
        `表名：${d.meterName || "–"} · 表号：${d.meterNo || "–"} · 单价 ${d.pricePerKwh || 1} 元/kWh`;

      document.getElementById("c-balance").innerHTML = `${fmt(last.remainingMoney)}<small>元</small>`;
      document.getElementById("c-kwh").innerHTML = `${fmt(last.remainingKwh)}<small>kWh</small>`;
      document.getElementById("c-today").innerHTML = `${fmt(last.consumedCost)}<small>元</small>`;

      const costs = recs.map(r => r.consumedCost).filter(v => !isNaN(v));
      const avg = costs.length ? costs.reduce((a, b) => a + b, 0) / costs.length : 0;
      document.getElementById("c-avg").innerHTML = `${fmt(avg)}<small>元</small>`;

      const dates = recs.map(r => r.date.slice(5));
      const balance = recs.map(r => r.remainingMoney);
      const dailyCost = recs.map(r => r.consumedCost);
      const barColors = recs.map(r => r.recharged ? RED : BAR);

      drawLine(document.getElementById("balanceChart"), dates, balance);
      drawBars(document.getElementById("costChart"), dates, dailyCost, barColors);
    }

    async function load() {
      const meta = document.getElementById("meta");
      const cards = document.getElementById("cards");
      let data;
      try {
        const res = await fetch("./data/electricity.json", { cache: "no-store" });
        data = await res.json();
      } catch (e) {
        meta.textContent = "无法加载数据，请确认已部署 data/electricity.json。";
        cards.style.display = "none";
        document.querySelectorAll(".panel").forEach(p => (p.style.display = "none"));
        return;
      }

      const recs = Array.isArray(data.records) ? data.records : [];
      if (!recs.length) {
        meta.textContent = "暂无数据，等待首次抓取。";
        cards.style.display = "none";
        document.querySelectorAll(".panel").forEach(p => (p.style.display = "none"));
        return;
      }

      cache = data;
      document.getElementById("cards").style.display = "";
      document.querySelectorAll(".panel").forEach(p => (p.style.display = ""));
      render(data);
    }

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (cache) render(cache); }, 200);
    });

    load();
  </script>
</body>
</html>
